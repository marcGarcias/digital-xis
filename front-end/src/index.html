<!doctype html>
<html lang="pt-BR">

<head>
  <!-- ==================== TÉCNICO ==================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- ==================== LCP & PERFORMANCE ==================== -->
  <!-- Preconnect para origens críticas (API e Assets) -->
  <link rel="preconnect" href="https://landing-page-dxis.vercel.app" />
  <link rel="preconnect" href="https://digitalxis.com.br" />

  <!-- Logos são LCP candidates — preload em SVG é muito mais leve -->
  <link rel="preload" as="image" href="/assets/images/brand/color-logo.svg" />
  <link rel="preload" as="image" href="/assets/images/brand/bw-logo.svg" />

  <!-- Preload da imagem LCP (About Us Large) para eliminar o atraso de descoberta de 2.6s -->
  <link rel="preload" as="image" href="assets/images/fallbacks/about-us/mobile/inferior_horizontal.webp" />

  <!-- ==================== SEO PRINCIPAL ==================== -->
  <title>DigitalXis | Marketing Digital & Gestão de Redes Sociais</title>
  <meta name="description"
    content="Agência de marketing 100% digital. Gestão de redes sociais, tráfego pago, identidade visual e criação de conteúdo estratégico para crescer sua marca online." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://digitalxis.com.br/" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- ==================== PALAVRAS-CHAVE ==================== -->
  <meta name="keywords"
    content="marketing digital, gestão de redes sociais, tráfego pago, identidade visual, criação de conteúdo, agência digital, DigitalXis, dxis, digitalx" />

  <!-- ==================== OPEN GRAPH (Facebook / WhatsApp / LinkedIn) ==================== -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://digitalxis.com.br/" />
  <meta property="og:title" content="DigitalXis | Marketing Digital & Gestão de Redes Sociais" />
  <meta property="og:description"
    content="Agência de marketing 100% digital. Gestão de redes sociais, tráfego pago, identidade visual e criação de conteúdo estratégico para crescer sua marca online." />
  <meta property="og:image" content="/assets/images/og_image.jpg" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="DigitalXis" />

  <!-- ==================== TWITTER CARDS ==================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DigitalXis | Marketing Digital & Gestão de Redes Sociais" />
  <meta name="twitter:description"
    content="Agência de marketing 100% digital. Gestão de redes sociais, tráfego pago, identidade visual e criação de conteúdo estratégico." />
  <meta name="twitter:image" content="https://digitalxis.com.br/assets/images/og-cover.jpg" />

  <!-- ==================== AUTOR / CRÉDITOS ==================== -->
  <meta name="author" content="Marcelo Garcias" />
  <meta name="creator" content="Marcelo Garcias" />
  <meta name="developer" content="Marcelo Garcias - Fullstack Developer" />
  <meta name="contact" content="dev.garcias@proton.me" />
  <meta name="website" content="https://marcelogarcias.dev.br" />
  <meta name="generator" content="Angular + Spring Boot" />
  <meta name="copyright" content="DigitalXis 2026" />

  <!-- ==================== SCHEMA MARKUP ==================== -->

  <!-- Organização -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "DigitalXis",
    "url": "https://digitalxis.com.br",
    "logo": "https://digitalxis.com.br/assets/images/logo.png",
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "availableLanguage": "Portuguese"
    },
    "sameAs": [
      "https://instagram.com/digitalxis"
    ]
  }
  </script>

  <!-- Serviços -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "name": "Gestão de Marketing Digital",
    "provider": {
      "@type": "Organization",
      "name": "DigitalXis"
    },
    "description": "Gestão de redes sociais, tráfego pago, identidade visual e criação de conteúdo estratégico para crescer sua marca online.",
    "areaServed": "BR",
    "serviceType": "Marketing Digital"
  }
  </script>

  <!-- Desenvolvedor -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Marcelo Garcias",
    "jobTitle": "Fullstack Developer",
    "url": "https://marcelogarcias.dev.br",
    "email": "dev.garcias@proton.me"
  }
  </script>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
