<div class="media-group" *ngIf="info">

  <div class="dual-button">
    <!-- Whatsapp -->
    <a class="media-link whatsapp" [href]="whatsappLink" target="_blank" rel="noopener noreferrer">
      <img src="assets/images/misc/color-whatsapp.svg" alt="Whatsapp">
    </a>

    <div class="divider"></div>

    <!-- Instagram -->
    <a class="media-link instagram" [href]="instagramLink" target="_blank" rel="noopener noreferrer">
      <img src="assets/images/misc/color-instagram.svg" alt="Instagram">
    </a>
  </div>

</div>
