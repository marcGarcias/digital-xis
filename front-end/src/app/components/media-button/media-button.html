<!-- src/app/persistent/header/media-button/media-button.html -->

<div class="media-group" *ngIf="info">

  <!-- Whatsapp -->
  <a class="media-button" [href]="whatsappLink" target="_blank" rel="noopener noreferrer">
    <img src="assets/images/misc/color-whatsapp.svg" alt="Whatsapp">
  </a>

  <!-- Instagram -->
  <a class="media-button" [href]="instagramLink" target="_blank" rel="noopener noreferrer">
    <img src="assets/images/misc/color-instagram.svg" alt="Instagram">
  </a>

</div>
