<section class="faq-container">
  <h2 class="category-title">FAQ – Perguntas frequentes</h2>

  <div class="faq-skeleton" *ngIf="loading">
    <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="skeleton-question">
        <div class="shimmer"></div>
      </div>
    </div>
  </div>

  <ng-container *ngIf="!loading">
    <div class="faq-item" *ngFor="let faq of faqs; let i = index">
      <button class="faq-question" (click)="toggle(i)" [attr.aria-expanded]="faq.aberta"
        [attr.aria-controls]="'faq-answer-' + i">
        <span>{{ faq.pergunta }}</span>
        <span class="arrow" [class.open]="faq.aberta">
          <img src="assets/images/misc/faq-arrow.svg" alt="" width="20" height="20">
        </span>
      </button>

      <div class="faq-answer" [id]="'faq-answer-' + i" *ngIf="faq.aberta" [innerHTML]="faq.resposta" role="region">
      </div>
    </div>
  </ng-container>
</section>
