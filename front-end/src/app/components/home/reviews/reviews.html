<h2 class="category-title">
  Feedback de quem viveu o resultado
</h2>


<div class="carousel-dots" *ngIf="!isDesktop">

  <span *ngFor="let _ of pages; let i = index" class="dot" [class.active]="i===pageIndex"
    [attr.aria-label]="'Ir para página de depoimentos ' + (i + 1)"
    [attr.aria-current]="i === pageIndex ? 'true' : 'false'">
  </span>

</div>


<div class="reviews-skeleton" *ngIf="loading">
  <div class="skeleton-card" *ngFor="let i of [1,2,3]">
    <div class="skeleton-comment">
      <div class="shimmer"></div>
    </div>
    <div class="skeleton-user">
      <div class="shimmer"></div>
    </div>
    <div class="skeleton-button">
      <div class="shimmer"></div>
    </div>
  </div>
</div>

<section class="reviews-carousel" [class.desktop]="isDesktop" *ngIf="!loading">


  <button *ngIf="!isDesktop" class="nav nav-left" (click)="prev()" aria-label="Depoimento anterior">

    <img class="review-arrow" src="assets/images/misc/review-arrow_left.svg" alt="" width="24" height="24">

  </button>


  <div class="reviews-viewport" (touchstart)="!isDesktop && onTouchStart($event)"
    (touchmove)="!isDesktop && onTouchMove($event)" (touchend)="!isDesktop && onTouchEnd()">


    <div class="reviews-track" [style.transform]="!isDesktop?transform:null">


      <ng-container *ngIf="!isDesktop">

        <div class="review-page" *ngFor="let page of pages">


          <article class="review-card" *ngFor="let review of page">


            <p class="review-comment">

              {{review.comment}}

            </p>


            <span class="review-user">

              — {{review.userName}}

            </span>


            <button class="read-button" [attr.aria-label]="'Ler depoimento completo de ' + review.userName"
              (click)="openOverlay(review)">

              Ler mais

            </button>


          </article>

        </div>

      </ng-container>



      <ng-container *ngIf="isDesktop">

        <article class="review-card" *ngFor="let review of duplicatedReviews">


          <p class="review-comment">

            {{review.comment}}

          </p>


          <span class="review-user">

            — {{review.userName}}

          </span>


          <button class="read-button" [attr.aria-label]="'Ler depoimento completo de ' + review.userName"
            (click)="openOverlay(review)">

            Ler mais

          </button>


        </article>

      </ng-container>


    </div>

  </div>


  <button *ngIf="!isDesktop" class="nav nav-right" (click)="next()" aria-label="Próximo depoimento">

    <img class="review-arrow" src="assets/images/misc/review-arrow_right.svg" alt="" width="24" height="24">

  </button>


</section>



<!-- OVERLAY -->


<div *ngIf="selectedReview" class="review-overlay" (click)="closeOverlay()">


  <div class="review-overlay-card" (click)="$event.stopPropagation()">



    <p class="overlay-comment">

      {{selectedReview.comment}}

    </p>


    <span class="overlay-user">

      — {{selectedReview.userName}}

    </span>


    <button class="read-button" (click)="closeOverlay()">

      Ler menos

    </button>


  </div>


</div>
